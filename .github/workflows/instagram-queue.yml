name: Update Instagram queue

# Rebuild instagram-queue.md whenever posts change on main, and every morning
# so posts whose time has passed move to "Missed".
on:
  push:
    branches: [main]
    paths:
      - "*/instagram/**"
      - "tools/instagram/**"
  schedule:
    - cron: "0 23 * * *" # 06:00 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/instagram/instagram.mjs queue --write
      - name: Commit if changed
        run: |
          git add instagram-queue.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Instagram queue [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
