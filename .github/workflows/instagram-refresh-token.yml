name: Renew Instagram token

# The Instagram token lasts 60 days. Renewing every Monday keeps it alive.
# Needs a GH_SECRETS_TOKEN secret: a fine-grained GitHub token for this repo
# with "Secrets: Read and write", so the renewed token can be saved.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Renew the token and save it as a secret
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node tools/instagram/instagram.mjs refresh --update-github-secrets
