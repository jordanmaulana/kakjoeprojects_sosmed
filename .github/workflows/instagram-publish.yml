name: Publish Instagram posts

# Every 15 minutes, publish each post folder whose "at" time has come,
# then commit its receipt (.instagram.json) so it is never published twice.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two publishers at once.
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish due posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node tools/instagram/instagram.mjs publish --due

      # Runs even if one post failed, so receipts for the ones that went out are kept.
      - name: Commit receipts
        if: always()
        run: |
          git add -- '*/instagram/*/.instagram.json'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record published Instagram posts [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
